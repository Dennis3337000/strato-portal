<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR-Drop — Privates Highspeed QuickShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body {
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.15), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15), transparent 40%);
      background-attachment: fixed;
    }
    .container { width: 100%; max-width: 560px; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
      background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 9999px; color: #34d399; font-size: 0.75rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem;
    }
    .header h1 {
      font-size: 2.25rem; font-weight: 900; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem;
    }
    .header p { font-size: 0.95rem; color: #94a3b8; }
    .card {
      background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px; padding: 1.75rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    
    /* Drop Zone */
    .dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.15); border-radius: 20px;
      padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
      transition: all 0.2s; background: rgba(15, 23, 42, 0.5);
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: #10b981; background: rgba(16, 185, 129, 0.08);
      transform: scale(1.01);
    }
    .drop-icon {
      font-size: 3rem; margin-bottom: 1rem; display: block;
      transition: transform 0.2s;
    }
    .dropzone:hover .drop-icon { transform: translateY(-4px) scale(1.05); }
    .drop-title { font-size: 1.05rem; font-weight: 800; color: #ffffff; margin-bottom: 0.25rem; }
    .drop-desc { font-size: 0.8rem; color: #94a3b8; }

    /* Expiry & Options */
    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1.25rem;
    }
    .opt-select {
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px; padding: 0.75rem; color: #ffffff; font-size: 0.85rem;
      font-weight: 700; outline: none; cursor: pointer;
    }
    .opt-burn {
      display: flex; align-items: center; gap: 8px; background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px;
      padding: 0.75rem 1rem; color: #cbd5e1; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; user-select: none;
    }
    .opt-burn input { accent-color: #ef4444; width: 16px; height: 16px; cursor: pointer; }

    /* Progress Bar */
    .progress-box { display: none; margin-top: 1.5rem; }
    .progress-box.active { display: block; }
    .progress-bar-bg {
      width: 100%; height: 10px; background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px; overflow: hidden; margin-top: 0.5rem;
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #06b6d4);
      transition: width 0.15s ease; border-radius: 9999px;
    }

    /* Success QR Card */
    .qr-card {
      display: none; margin-top: 1.5rem; padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center;
    }
    .qr-card.active { display: block; animation: fadeIn 0.3s ease; }
    .qr-container {
      background: #ffffff; padding: 12px; border-radius: 16px;
      display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 1rem;
    }
    .qr-container img { display: block; margin: 0 auto; }
    .file-details { margin-bottom: 1.25rem; }
    .file-name { font-size: 1rem; font-weight: 800; color: #ffffff; margin-bottom: 2px; }
    .file-sub { font-size: 0.8rem; color: #94a3b8; }
    
    .link-box {
      display: flex; gap: 8px; background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px;
      padding: 6px 8px 6px 14px; align-items: center; margin-bottom: 1rem;
    }
    .link-text { flex: 1; font-size: 0.85rem; color: #38bdf8; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-copy {
      background: #10b981; color: #ffffff; border: none; padding: 8px 14px;
      border-radius: 10px; font-size: 0.8rem; font-weight: 800; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy:hover { background: #059669; }
    .btn-reset {
      background: transparent; border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8; padding: 8px 16px; border-radius: 12px; font-size: 0.85rem;
      font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .btn-reset:hover { color: #ffffff; border-color: rgba(255, 255, 255, 0.3); }

    .back-home { margin-top: 2rem; text-align: center; }
    .back-home a { color: #94a3b8; text-decoration: none; font-size: 0.85rem; font-weight: 700; transition: color 0.2s; }
    .back-home a:hover { color: #ffffff; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-badge">
        <span>⚡ Direkt • Schnell • Privat</span>
      </div>
      <h1>QR-Drop</h1>
      <p>Dateien zwischen PC & Handy teilen — einfach per QR-Code</p>
    </div>

    <div class="card">
      <input type="file" id="fileInput" style="display: none;" />

      <!-- Dropzone -->
      <div id="dropzone" class="dropzone">
        <span class="drop-icon">📲</span>
        <h3 class="drop-title">Datei hier ablegen oder antippen</h3>
        <p class="drop-desc">Fotos, Videos, PDFs, Dokumente bis zu 500 MB</p>
      </div>

      <!-- Upload Options -->
      <div class="options-grid">
        <select id="expirySelect" class="opt-select">
          <option value="1h">⏱️ Gültig für 1 Stunde</option>
          <option value="6h">⏱️ Gültig für 6 Stunden</option>
          <option value="24h" selected>⏱️ Gültig für 24 Stunden</option>
          <option value="7d">⏱️ Gültig für 7 Tage</option>
        </select>

        <label class="opt-burn">
          <input type="checkbox" id="burnCheck" />
          <span>🔥 Nach Download löschen</span>
        </label>
      </div>

      <!-- Progress Box -->
      <div id="progressBox" class="progress-box">
        <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8;">
          <span id="progressText">Wird hochgeladen...</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>

      <!-- QR Code & Link Result Card -->
      <div id="qrCard" class="qr-card">
        <div id="qrcode" class="qr-container"></div>

        <div class="file-details">
          <div id="resFileName" class="file-name"></div>
          <div id="resFileSize" class="file-sub"></div>
        </div>

        <div class="link-box">
          <span id="resLinkText" class="link-text"></span>
          <button id="btnCopy" class="btn-copy" type="button">Kopieren</button>
        </div>

        <button id="btnReset" class="btn-reset" type="button">Weitere Datei hochladen</button>
      </div>
    </div>

    <div class="back-home">
      <a href="/">← Zurück zum Strato Portal</a>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const expirySelect = document.getElementById('expirySelect');
    const burnCheck = document.getElementById('burnCheck');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const progressPct = document.getElementById('progressPct');
    const qrCard = document.getElementById('qrCard');
    const qrcodeDiv = document.getElementById('qrcode');
    const resFileName = document.getElementById('resFileName');
    const resFileSize = document.getElementById('resFileSize');
    const resLinkText = document.getElementById('resLinkText');
    const btnCopy = document.getElementById('btnCopy');
    const btnReset = document.getElementById('btnReset');

    dropzone.addEventListener('click', () => fileInput.click());

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        uploadFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        uploadFile(fileInput.files[0]);
      }
    });

    function uploadFile(file) {
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);
      formData.append('expiry', expirySelect.value);
      formData.append('burn_after_read', burnCheck.checked ? 'true' : 'false');

      progressBox.classList.add('active');
      dropzone.style.display = 'none';
      qrCard.classList.remove('active');

      const xhr = new XMLHttpRequest();
      
      const uploadUrl = window.location.pathname.endsWith('/')
        ? window.location.pathname + 'api/upload'
        : window.location.pathname + '/api/upload';

      xhr.open('POST', uploadUrl.replace('//', '/'), true);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          progressBar.style.width = percent + '%';
          progressPct.textContent = percent + '%';
        }
      };

      xhr.onload = () => {
        progressBox.classList.remove('active');
        if (xhr.status === 200) {
          const res = JSON.parse(xhr.responseText);
          showSuccess(res);
        } else {
          alert('Upload fehlgeschlagen: ' + xhr.statusText);
          dropzone.style.display = 'block';
        }
      };

      xhr.onerror = () => {
        progressBox.classList.remove('active');
        alert('Netzwerkfehler beim Upload.');
        dropzone.style.display = 'block';
      };

      xhr.send(formData);
    }

    function showSuccess(data) {
      resFileName.textContent = data.filename;
      resFileSize.textContent = data.size + (data.burn_after_read ? ' • 🔥 Löscht sich nach 1x Download' : '');

      const host = window.location.host;
      const protocol = window.location.protocol;
      const downloadPath = window.location.pathname.endsWith('/')
        ? window.location.pathname + 'd/' + data.token
        : window.location.pathname + '/d/' + data.token;
      
      const fullUrl = `${protocol}//${host}${downloadPath.replace('//', '/')}`;

      resLinkText.textContent = fullUrl;

      // QR Code rendern
      qrcodeDiv.innerHTML = '';
      new QRCode(qrcodeDiv, {
        text: fullUrl,
        width: 180,
        height: 180,
        colorDark: "#090d16",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      qrCard.classList.add('active');
    }

    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(resLinkText.textContent);
        btnCopy.textContent = 'Kopiert! ✅';
        setTimeout(() => btnCopy.textContent = 'Kopieren', 2000);
      } catch (err) {
        prompt('Link kopieren:', resLinkText.textContent);
      }
    });

    btnReset.addEventListener('click', () => {
      qrCard.classList.remove('active');
      dropzone.style.display = 'block';
      fileInput.value = '';
      progressBar.style.width = '0%';
      progressPct.textContent = '0%';
    });
  </script>
</body>
</html>
