worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost; # Ersetze dies später mit deiner Domain, falls vorhanden

        # Haupt-Landing-Page
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # Die Couple App routen wir an den FastAPI Container
        location /couple/ {
            # Wichtig: Wir schneiden /couple/ weg, wenn wir es ans Backend schicken
            proxy_pass http://couple-app:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Der CryptoAnalyzer wird über /crypto/ erreichbar sein
        location /crypto/ {
            # Leitet Anfragen an einen Container namens 'cryptoanalyzer' oder einen freigegebenen Port weiter
            proxy_pass http://cryptoanalyzer:80/; # Passe den Port an, falls der CryptoAnalyzer intern einen anderen nutzt
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
