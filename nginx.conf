worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 1. Haupt-Landing-Page
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # 1.1 Weiterleitungen ohne Slash
        location = /couple {
            return 301 /couple/;
        }

        location = /crypto {
            return 301 /crypto/;
        }

        # 2. Couple App Routing
        location /couple/ {
            proxy_pass http://couple-app:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2.1. Workaround fuer API-Calls der Couple-App, falls diese absolut auf /api/ zugreifen
        location ~ ^/api/(events|meals|notes|shopping|bucket|countdown|mood|quiz|profile|hugs|location) {
            proxy_pass http://couple-app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Crypto Bot Routing
        location /crypto/ {
            proxy_pass http://crypto-analyzer:80/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3.1. Workaround für Vite/React Assets des Crypto-Bots
        location /assets/ {
            proxy_pass http://crypto-analyzer:80/assets/;
            proxy_set_header Host $host;
        }
        
        # 3.2. Workaround für API-Calls des Crypto-Bots, falls diese absolut auf /api/ zugreifen
        location /api/bot/ {
            proxy_pass http://crypto-analyzer:80/api/bot/;
            proxy_set_header Host $host;
        }

        # 3.3. Workaround für den Login-Endpunkt des Crypto-Bots
        location /api/auth/ {
            proxy_pass http://crypto-analyzer:80/api/auth/;
            proxy_set_header Host $host;
        }
    }
}
