worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Docker interner DNS-Resolver (verhindert 502 Bad Gateway bei Container-Rebuilds)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen       80;
        server_name  localhost;
        client_max_body_size 50M;

        # 1. Haupt-Landing-Page
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # 1.1 Weiterleitungen ohne Slash
        location = /couple {
            return 301 /couple/;
        }

        location = /crypto {
            return 301 /crypto/;
        }

        location = /slot {
            return 301 /slot/;
        }

        location = /status {
            return 301 /status/;
        }

        # 2. Couple App Routing
        location /couple/ {
            proxy_pass http://couple-app:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2.1. Workaround fuer API-Calls der Couple-App
        location ~ ^/api/(events|meals|notes|shopping|bucket|countdown|mood|quiz|profile|hugs|location|coupons|most-likely|date-ideas|letters|photos|uploads) {
            proxy_pass http://couple-app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Crypto Bot Routing
        location /crypto/ {
            proxy_pass http://crypto-analyzer:80/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3.1. Assets des Crypto-Bots
        location /assets/ {
            proxy_pass http://crypto-analyzer:80/assets/;
            proxy_set_header Host $host;
        }
        
        # 3.2. Alle API-Calls des Crypto-Bots (bot, auth, coins, market, best-pick, prices, klines)
        location ~ ^/api/(bot|auth|coins|market|best-pick|prices|klines) {
            proxy_pass http://crypto-analyzer:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Deluxe Slot Machine
        location /slot/ {
            alias /usr/share/nginx/slot/;
            index index.html;
        }

        # 5. Uptime Kuma (24/7 Monitor & Radar)
        location /status/ {
            proxy_pass http://uptime-kuma:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 5.1. WebSocket fuer Uptime Kuma Live-Daten
        location /socket.io/ {
            proxy_pass http://uptime-kuma:3001/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
