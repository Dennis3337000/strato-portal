worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Docker interner DNS-Resolver (verhindert 502 Bad Gateway bei Container-Rebuilds)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen       80;
        server_name  localhost;
        client_max_body_size 50M;

        # 1. Haupt-Landing-Page
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # 1.1 Weiterleitungen ohne Slash
        location = /couple {
            return 301 /couple/;
        }

        location = /crypto {
            return 301 /crypto/;
        }

        location = /slot {
            return 301 /slot/;
        }

        location = /downloader {
            return 301 /downloader/;
        }

        location = /drop {
            return 301 /drop/;
        }

        location = /tanken {
            return 301 /tanken/;
        }

        # 2. Couple App Routing
        location /couple/ {
            proxy_pass http://couple-app:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2.1. Workaround fuer API-Calls der Couple-App
        location ~ ^/api/(events|meals|notes|shopping|bucket|countdown|mood|quiz|profile|hugs|location|coupons|most-likely|date-ideas|letters|photos|uploads) {
            proxy_pass http://couple-app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Crypto Bot Routing
        location /crypto/ {
            proxy_pass http://crypto-analyzer:80/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3.1. Assets des Crypto-Bots
        location /assets/ {
            proxy_pass http://crypto-analyzer:80/assets/;
            proxy_set_header Host $host;
        }
        
        # 3.2. Alle API-Calls des Crypto-Bots (bot, auth, coins, market, best-pick, prices, klines)
        location ~ ^/api/(bot|auth|coins|market|best-pick|prices|klines) {
            proxy_pass http://crypto-analyzer:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Deluxe Slot Machine
        location /slot/ {
            alias /usr/share/nginx/slot/;
            index index.html;
        }

        # 5. Media Downloader (YouTube / TikTok / Insta)
        location /downloader/ {
            proxy_pass http://media-downloader:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 6. QR-Drop (Privates QuickShare & WeTransfer)
        location /drop/ {
            proxy_pass http://qr-drop:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 500M;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 7. TankSmart (Live Spritpreis Radar)
        location /tanken/ {
            proxy_pass http://tanksmart:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
