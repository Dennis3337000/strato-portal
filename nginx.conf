worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 1. Haupt-Landing-Page
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # 2. Couple App Routing
        location /couple/ {
            proxy_pass http://couple-app:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Crypto Bot Routing
        location /crypto/ {
            # Leitet Anfragen an den internen crypto-analyzer Container
            proxy_pass http://crypto-analyzer:80/; # Falls dein Bot intern einen anderen Port nutzt, ändern wir die 80 hier
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
