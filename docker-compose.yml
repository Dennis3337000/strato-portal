version: '3.8'

# Ein einziges gemeinsames Netzwerk für alle deine Projekte
networks:
  strato-net:
    name: strato-net

services:
  # ==========================================
  # 1. DER TÜRSTEHER (Reverse Proxy)
  # ==========================================
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - strato-net
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./landing-page:/usr/share/nginx/html:ro
      - ./slot-machine:/usr/share/nginx/slot:ro
    depends_on:
      - couple-app
      - crypto-analyzer

  # ==========================================
  # 2. DIE COUPLE APP
  # ==========================================
  couple-app:
    build: 
      context: ./couple-app
    networks:
      - strato-net
    restart: unless-stopped
    volumes:
      - couple-app-data:/app/data

  # ==========================================
  # 3. DER CRYPTO BOT
  # ==========================================
  crypto-analyzer:
    build:
      context: ./crypto-analyzer
    networks:
      - strato-net
    restart: unless-stopped
    volumes:
      - crypto-analyzer-data:/app/backend/data

  # ==========================================
  # 4. MEDIA DOWNLOADER (YouTube / TikTok / Insta)
  # ==========================================
  media-downloader:
    build:
      context: ./media-downloader
    networks:
      - strato-net
    restart: unless-stopped

  # ==========================================
  # 5. QR-DROP (Privates QuickShare & WeTransfer)
  # ==========================================
  qr-drop:
    build:
      context: ./qr-drop
    networks:
      - strato-net
    restart: unless-stopped
    volumes:
      - qr-drop-data:/app/uploads

volumes:
  couple-app-data:
  crypto-analyzer-data:
  qr-drop-data:
