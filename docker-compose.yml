version: '3.8'

# Ein einziges gemeinsames Netzwerk für alle deine Projekte
networks:
  strato-net:
    name: strato-net

services:
  # ==========================================
  # 1. DER TÜRSTEHER (Reverse Proxy)
  # ==========================================
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - strato-net
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./landing-page:/usr/share/nginx/html:ro
    depends_on:
      - couple-app
      # - crypto-analyzer # EINKOMMENTIEREN, wenn der Crypto-Bot hinzugefügt wurde

  # ==========================================
  # 2. DIE COUPLE APP
  # ==========================================
  couple-app:
    build: 
      context: ./couple-app
    networks:
      - strato-net
    restart: unless-stopped
    volumes:
      - couple-app-data:/app/data

  # ==========================================
  # 3. DER CRYPTO BOT (Beispielhaft vorbereitet)
  # ==========================================
  # crypto-analyzer:
  #   build:
  #     context: ./crypto-analyzer
  #   networks:
  #     - strato-net
  #   restart: unless-stopped
  #   # WICHTIG: Keine "ports" Sektion hier! Er ist nur intern über das strato-net erreichbar.

volumes:
  couple-app-data:
