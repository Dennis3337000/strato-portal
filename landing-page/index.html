<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strato Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portal-container">
        <header>
            <h1>Willkommen zurück</h1>
            <p>Wähle dein Ziel</p>
        </header>
        
        <div class="cards-grid">
            <!-- Couple App Card -->
            <a href="/couple" class="card couple-card">
                <div class="card-icon">❤️</div>
                <h2>Couple App</h2>
                <p>Kalender, Essensplan & gemeinsame Momente</p>
                <div class="card-footer">Öffnen &rarr;</div>
            </a>

            <!-- Crypto Bot Card -->
            <a href="/crypto" class="card crypto-card">
                <div class="card-icon">📈</div>
                <h2>Crypto Bot</h2>
                <p>Trading-Dashboard & Portfolio-Überwachung</p>
                <div class="card-footer">Öffnen &rarr;</div>
            </a>

            <!-- Deluxe Slot Machine Card -->
            <a href="/slot" class="card slot-card">
                <div class="card-icon">🎰</div>
                <h2>Slot Machine</h2>
                <p>Royale Fortune Casino & Jackpots</p>
                <div class="card-footer">Spielen &rarr;</div>
            </a>

            <!-- Uptime Kuma Card -->
            <a href="/status" class="card status-card">
                <div class="card-icon">🛡️</div>
                <h2>Server Radar</h2>
                <p>24/7 Uptime Kuma & Live-Wächter</p>
                <div class="card-footer">Status &rarr;</div>
            </a>
        </div>
    </div>
</body>
</html>
